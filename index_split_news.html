    nav a {
      padding: 10px 16px; border: 1.5px solid #111; border-radius: 999px; text-decoration: none; color: #111; background: #fff; 
      box-shadow: var(--nav-depth) var(--nav-depth) 0 #111;
    }
    nav a.active {
      background: #111; color: #fff; border-color: #111;
      box-shadow: var(--nav-depth) var(--nav-depth) 0 #fff, calc(var(--nav-depth) + 1.5px) calc(var(--nav-depth) + 1.5px) 0 #111;

    .card { border: 1px solid #eee; border-radius: 14px; padding: 18px; background: #fafafa; }
    .hint { color: #666; }
    .loading { color:#666; }
    .error { color:#b00020; }
    code { background: #fff; border: 1px solid #e6e6e6; padding: 2px 6px; border-radius: 6px; }
    body.learn-mode header { display: none; }
    body.learn-mode main { max-width: none; padding: 0; }
    body.learn-mode .card { border: 0; border-radius: 0; padding: 0; background: transparent; }
    body.learn-mode #page-title,
    body.learn-mode #page-subtitle { display: none; }
    body.learn-mode #app { margin-top: 0 !important; }

    .menu-tabs { display: flex; gap: 8px; flex-wrap: wrap; }
    .menu-tab { display: inline-block; padding: 8px 12px; border: 1px solid #e8e8e8; border-radius: 999px; text-decoration: none; color: #111; background: #fff; }
    .menu-tab.active { background: #111; color: #fff; border-color: #111; }

    .news-cta-wrap { margin: 0 0 18px; }
    .news-dropdown { position: relative; display: inline-block; }
    .news-dropdown-btn {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 10px 16px; border: 1.5px solid #111; border-radius: 999px;
      background: #fff; color: #111; text-decoration: none; cursor: pointer;
      box-shadow: var(--nav-depth) var(--nav-depth) 0 #111; font-size: 15px;
    }
    .news-dropdown-btn::after { content: "▾"; font-size: 12px; }
    .news-dropdown-panel {
      position: absolute; top: calc(100% + 10px); left: 0; min-width: 320px;
      background: #fff; border: 1.5px solid #111; border-radius: 18px; padding: 10px;
      box-shadow: 8px 8px 0 #111; display: none; z-index: 1200;
    }
    .news-dropdown.open .news-dropdown-panel { display: block; }
    .news-dropdown-item {
      display: flex; gap: 12px; align-items: center; text-decoration: none; color: #111;
      padding: 10px; border-radius: 14px;
    }
    .news-dropdown-item:hover { background: #f6f6f6; }
    .news-dropdown-item + .news-dropdown-item { margin-top: 6px; }
    .news-dropdown-thumb { width: 72px; height: 72px; object-fit: cover; border-radius: 12px; border: 1px solid #eee; flex: 0 0 auto; }
    .news-dropdown-meta { min-width: 0; }
    .news-dropdown-title { font-weight: 700; line-height: 1.4; }
    .news-dropdown-date { color: #666; font-size: 13px; margin-top: 4px; }
    .news-hero {
      display: grid; gap: 18px; margin-top: 18px;
      grid-template-columns: minmax(0, 1.35fr) minmax(280px, 0.85fr);
      align-items: stretch;
    }
    .news-slider {
      background: #fff; border: 1px solid #ececec; border-radius: 24px; overflow: hidden;
      box-shadow: 0 14px 40px rgba(0,0,0,.06); position: relative;
    }
    .news-slider-track { display: flex; transition: transform .45s ease; }
    .news-slide { min-width: 100%; display: block; text-decoration: none; color: #111; }
    .news-slide-media { aspect-ratio: 16 / 9; background: #f0f0f0; }
    .news-slide-media img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .news-slide-body { padding: 18px 18px 22px; }
    .news-kicker { color: #666; font-size: 13px; margin-bottom: 8px; }
    .news-slide-title { font-size: 24px; font-weight: 800; line-height: 1.35; margin: 0 0 10px; }
    .news-slide-excerpt { color: #555; line-height: 1.75; margin: 0; }
    .news-slide-actions {
      position: absolute; inset: auto 16px 16px auto; display: flex; gap: 8px; z-index: 2;
    }
    .news-slide-btn {
      width: 42px; height: 42px; border-radius: 999px; border: 1.5px solid #111;

    }
    .news-slide-dots { display: flex; gap: 8px; margin-top: 14px; }
    .news-slide-dot {

    .news-slide-dot.active { background: #111; }
    .news-side-panel {

    .news-side-card {

    .news-side-card h4 { margin: 0 0 6px; font-size: 15px; line-height: 1.5; }
    .news-side-card p { margin: 0; color: #666; font-size: 13px; line-height: 1.6; }
    .news-section-list { display: grid; gap: 18px; }
    .news-section-card {

      background: #fff; border: 1px solid #ececec; border-radius: 24px; padding: 14px;

    .news-section-card p { margin: 0; color: #555; line-height: 1.8; }
    .news-badge {

    .news-article { display: grid; gap: 22px; }

    .news-article-header h1 { margin: 10px 0 0; line-height: 1.4; }

    @media (max-width: 860px) {

    function escapeHtml(str) {
      return String(str).replace(/[&<>"]/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[ch]));
    }

    function formatNewsDate(dateStr) {
      const d = new Date(dateStr + 'T00:00:00');
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return `${y}.${m}.${day}`;
    }

    function setupNewsDropdown(scope) {
      const dropdown = scope.querySelector('#news-dropdown');
      if (!dropdown) return;
      const btn = dropdown.querySelector('.news-dropdown-btn');
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        const open = dropdown.classList.toggle('open');
        btn.setAttribute('aria-expanded', open ? 'true' : 'false');
      });
      document.addEventListener('click', () => {
        dropdown.classList.remove('open');
        btn.setAttribute('aria-expanded', 'false');
      }, { once: true });
      dropdown.querySelector('.news-dropdown-panel')?.addEventListener('click', (e) => e.stopPropagation());
    }

    function setupHomeSlider(scope) {
      const slider = scope.querySelector('#home-news-slider');
      if (!slider) return;
      const track = slider.querySelector('.news-slider-track');
      const slides = Array.from(slider.querySelectorAll('.news-slide'));
      const allDotRows = Array.from(slider.querySelectorAll('.news-slide-dots'));
      let current = 0;
      function paint() {
        track.style.transform = `translateX(-${current * 100}%)`;
        allDotRows.forEach(row => {
          row.querySelectorAll('.news-slide-dot').forEach((dot, idx) => {
            dot.classList.toggle('active', idx === current);
          });
        });
      }
      slider.addEventListener('click', (e) => {
        const dirBtn = e.target.closest('[data-slide-dir]');
        const dot = e.target.closest('[data-slide-to]');
        if (dirBtn) {
          e.preventDefault();
          current = dirBtn.dataset.slideDir === 'next' ? (current + 1) % slides.length : (current - 1 + slides.length) % slides.length;
          paint();
          return;
        }
        if (dot) {
          e.preventDefault();
          current = Number(dot.dataset.slideTo || 0);
          paint();
        }
      });
      paint();
    }


    function matchRoute(pathname) {
      if (routes[pathname]) return pathname;
      if (pathname.length > 1 && pathname.endsWith("/")) {
        const p2 = pathname.slice(0, -1);
        if (routes[p2]) return p2;
      }
      return "/";
    }

    function setActiveNav(pathname) {
      document.querySelectorAll("nav a[data-link]").forEach(a => {
        const url = new URL(a.getAttribute("href"), window.location.origin);
        a.classList.toggle("active", url.pathname === pathname);
      });
    }
    function setLearnMode(isOn) {
      document.body.classList.toggle("learn-mode", isOn);
    }

    const pageCache = new Map();
    async function loadFragment(file) {
      if (pageCache.has(file)) return pageCache.get(file);

      const res = await fetch(file, { cache: "no-store" });
      if (!res.ok) throw new Error(`載入失敗：${res.status} ${res.statusText}（${file}）`);

      const html = await res.text();
      pageCache.set(file, html);
      return html;
    }

    async function render(pathname) {
      const key = matchRoute(pathname);
      const r = routes[key];
      setLearnMode(key === "/resources/learning");
      document.getElementById("page-title").textContent = r.title;
      document.getElementById("page-subtitle").textContent = r.subtitle || "";
      setActiveNav(key);
      document.title = `台灣黑白棋協會｜${r.title}`;

      const app = document.getElementById("app");
      app.innerHTML = `<p class="loading">載入中…</p>`;

      try {
        if (typeof r.render === "function") {
          app.innerHTML = r.render();
          setupNewsDropdown(app);
          setupHomeSlider(app);
          return;
        }

        const html = await loadFragment(r.file);
        await injectHtmlAndRunScripts(app, html);

        if (key === "/") {
          const newsWrap = document.createElement("div");
          newsWrap.innerHTML = createHomeNewsHtml();
          app.prepend(newsWrap);
          setupNewsDropdown(app);
          setupHomeSlider(app);
        }
      } catch (err) {
        app.innerHTML = `
          <p class="error">內容載入失敗。</p>
          <p class="hint">${String(err.message || err)}</p>
          <p class="hint">請確認檔案存在：<code>${r.file || "inline renderer"}</code></p>
        `;
      }
    }

    async function injectHtmlAndRunScripts(container, htmlText) {
      const tpl = document.createElement("template");
      tpl.innerHTML = htmlText;

      const scripts = Array.from(tpl.content.querySelectorAll("script"));
      scripts.forEach(s => s.remove());
      container.innerHTML = "";
      container.appendChild(tpl.content);

      for (const old of scripts) {
        const s = document.createElement("script");
        for (const attr of Array.from(old.attributes)) {
          s.setAttribute(attr.name, attr.value);
        }
        if (!old.src) s.textContent = old.textContent;

        document.body.appendChild(s);

        if (old.src) {
          await new Promise((res, rej) => {
            s.onload = res;
            s.onerror = () => rej(new Error(`Script 載入失敗：${old.src}`));
          });
        }
      }
    }

    document.addEventListener("click", (e) => {
      const a = e.target.closest("a[data-link]");
      if (!a) return;
      if (e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
      e.preventDefault();
      const href = a.getAttribute("href");
      window.history.pushState(null, "", href);
      render(window.location.pathname);
    });
    window.addEventListener("popstate", () => render(window.location.pathname));
    render(window.location.pathname);
  </script>
</body>
</html>

<section class="manga">
  <h3 class="manga-title">《游泳的金魚》</h3>
  <p class="manga-subtitle">往下滾動瀏覽。圖片來源：<code>data/manga/</code></p>

  <div id="manga-list" class="manga-list" aria-live="polite"></div>

  <div id="manga-status" class="manga-status"></div>
</section>

<style>
  .manga {
    padding: 8px 0;
  }
  .manga-title {
    margin: 0 0 6px;
    font-size: 20px;
  }
  .manga-subtitle {
    margin: 0 0 14px;
    color: #666;
    line-height: 1.5;
  }

  /* 圖片等寬、置中、可向下捲動（頁面本身就可捲） */
  .manga-list {
    display: grid;
    gap: 14px;
  }

  .manga-item {
    display: flex;
    justify-content: center;
  }

  .manga-item img {
    width: min(860px, 100%);
    height: auto;
    display: block;
    border-radius: 12px;
    border: 1px solid #eee;
    background: #fff;
  }

  .manga-status {
    margin-top: 14px;
    color: #666;
    font-size: 14px;
    line-height: 1.6;
  }

  .manga-status .warn {
    color: #b00020;
  }
</style>

<script>
  (function () {
    const TOTAL = 30;
    // 你需求寫「從 User page -> data/manga/ 抓取圖片」
    // 這裡用相對路徑，假設你網站根目錄有 /data/manga/1.png ... 30.png
    const BASE = "/data/manga/";

    const list = document.getElementById("manga-list");
    const status = document.getElementById("manga-status");

    // 逐張加入到 DOM，瀏覽就是往下捲動
    let okCount = 0;
    let failCount = 0;

    for (let i = 1; i <= TOTAL; i++) {
      const item = document.createElement("div");
      item.className = "manga-item";

      const img = document.createElement("img");
      img.loading = "lazy";
      img.decoding = "async";
      img.alt = `manga ${i}`;
      img.src = `${BASE}${i}.png`;

      img.onload = () => {
        okCount++;
        renderStatus();
      };
      img.onerror = () => {
        failCount++;
        // 失敗就把該張隱藏，避免破圖影響閱讀
        item.remove();
        renderStatus(true);
      };

      item.appendChild(img);
      list.appendChild(item);
    }

    function renderStatus(hasError) {
      if (!status) return;
      const parts = [
        `已載入：${okCount} / ${TOTAL}`,
      ];
      if (failCount > 0) parts.push(`載入失敗：${failCount}`);

      status.innerHTML = hasError
        ? `<span class="warn">部分圖片載入失敗。</span><br>${parts.join("　")}`
        : parts.join("　");
    }

    renderStatus();
  })();
</script>

<section class="manga">
  <h3 class="manga-title">《游泳的金魚》</h3>

  <div class="controls">
    <label>
      偏移距離：
      <input id="offsetRange" type="range" min="0" max="0.2" step="0.002" />
      <span id="offsetValue"></span>
    </label>
    <button id="toggleOffset">關閉偏移</button>
  </div>

  <div id="manga-list" class="manga-list"></div>
</section>

<style>
  .manga { padding: 8px 0; }

  .controls {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    align-items: center;
    margin-bottom: 16px;
  }

  .controls input[type="range"] {
    width: 220px;
    vertical-align: middle;
  }

  .controls button {
    padding: 6px 12px;
    border-radius: 999px;
    border: 1px solid #ddd;
    background: #fff;
    cursor: pointer;
  }

  .manga-list {
    display: grid;
    gap: 18px;
  }

  .manga-item {
    display: flex;
    justify-content: center;
  }

  .manga-item img {
    width: min(860px, 100%);
    height: auto;
    display: block;
    border-radius: 12px;
    border: 1px solid #eee;
    transition: transform 0.2s ease;
  }
</style>

<script>
(function () {

  const TOTAL = 30;
  const BASE = "/data/manga/";

  const list = document.getElementById("manga-list");
  const range = document.getElementById("offsetRange");
  const valueText = document.getElementById("offsetValue");
  const toggleBtn = document.getElementById("toggleOffset");

  // ====== 預設偏移比例 1/23 ======
  let offsetRatio = 1 / 23;
  let offsetEnabled = true;

  range.value = offsetRatio;

  // 建立圖片
  for (let i = 1; i <= TOTAL; i++) {
    const item = document.createElement("div");
    item.className = "manga-item";

    const img = document.createElement("img");
    img.src = `${BASE}${i}.png`;
    img.loading = "lazy";
    img.dataset.index = i;

    img.onload = () => applyOffset(img);
    window.addEventListener("resize", () => applyOffset(img));

    item.appendChild(img);
    list.appendChild(item);
  }

  // ====== 套用偏移 ======
  function applyOffset(img) {
    if (!offsetEnabled) {
      img.style.transform = "translateX(0px)";
      return;
    }

    const width = img.clientWidth;
    const offset = width * offsetRatio;
    const index = parseInt(img.dataset.index, 10);

    if (index % 2 === 1) {
      // 奇數 → 右
      img.style.transform = `translateX(${offset}px)`;
    } else {
      // 偶數 → 左
      img.style.transform = `translateX(${-offset}px)`;
    }
  }

  function updateAllOffsets() {
    document.querySelectorAll(".manga-item img")
      .forEach(img => applyOffset(img));
  }

  // ====== 拉條事件 ======
  range.addEventListener("input", () => {
    offsetRatio = parseFloat(range.value);
    valueText.textContent = `(${offsetRatio.toFixed(3)} × 寬度)`;
    updateAllOffsets();
  });

  // ====== 切換開關 ======
  toggleBtn.addEventListener("click", () => {
    offsetEnabled = !offsetEnabled;

    toggleBtn.textContent = offsetEnabled ? "關閉偏移" : "開啟偏移";
    updateAllOffsets();
  });

  // 初始顯示數值
  valueText.textContent = `(${offsetRatio.toFixed(3)} × 寬度)`;

})();
</script>

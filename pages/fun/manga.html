<section class="manga">
  <div class="menu-top">
    <div class="menu-tabs">
      <a class="menu-tab active" href="/fun/manga" data-link>漫畫</a>
      <a class="menu-tab" href="/fun/links" data-link>友情連結</a>
      <a class="menu-tab" href="/fun/life" data-link>生活中的黑白棋</a>
    </div>

    <div class="manga-controls">
      <label class="manga-control">
        偏移距離：
        <input id="offsetRange" type="range" min="0" max="0.2" step="0.002" />
        <span id="offsetValue"></span>
      </label>
      <button id="toggleOffset" class="manga-btn">關閉偏移</button>
    </div>
  </div>

  <h3 class="manga-title">《游泳的金魚》</h3>
  <div id="manga-list" class="manga-list"></div>
</section>

<style>
  .manga { padding: 8px 0; }

  /* tabs 改用 index.html 全域 .menu-*；本頁只補 tabs 與 controls 的間距 */
  .manga .menu-tabs { margin-bottom: 12px; }

  /* ====== controls ====== */
  .manga-controls {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    align-items: center;
  }
  .manga-control { display: inline-flex; gap: 8px; align-items: center; }

  .manga-controls input[type="range"] {
    width: 220px;
    vertical-align: middle;
  }

  .manga-btn {
    padding: 6px 12px;
    border-radius: 999px;
    border: 1px solid #ddd;
    background: #fff;
    cursor: pointer;
  }

  /* ====== list ====== */
  .manga-title { margin: 0 0 14px; }

  .manga-list {
    display: grid;
    gap: 18px;
  }

  .manga-item {
    display: flex;
    justify-content: center;
  }

  .manga-item img {
    width: min(860px, 100%);
    height: auto;
    display: block;
    border-radius: 12px;
    border: 1px solid #eee;
    transition: transform 0.2s ease;
  }
</style>

<script>
(function () {
  const TOTAL = 30;
  const BASE = "/data/manga/";

  const list = document.getElementById("manga-list");
  const range = document.getElementById("offsetRange");
  const valueText = document.getElementById("offsetValue");
  const toggleBtn = document.getElementById("toggleOffset");

  // ====== 預設偏移比例 1/23 ======
  let offsetRatio = 1 / 23;
  let offsetEnabled = true;

  // range 會受 step 影響，這裡讓實際值與顯示一致
  range.value = String(offsetRatio);

  // 建立圖片
  for (let i = 1; i <= TOTAL; i++) {
    const item = document.createElement("div");
    item.className = "manga-item";

    const img = document.createElement("img");
    img.src = `${BASE}${i}.png`;
    img.loading = "lazy";
    img.dataset.index = String(i);

    img.onload = () => applyOffset(img);
    window.addEventListener("resize", () => applyOffset(img));

    item.appendChild(img);
    list.appendChild(item);
  }

  function applyOffset(img) {
    if (!offsetEnabled) {
      img.style.transform = "translateX(0px)";
      return;
    }

    const width = img.clientWidth;
    const offset = width * offsetRatio;
    const index = parseInt(img.dataset.index, 10);

    img.style.transform = (index % 2 === 1)
      ? `translateX(${offset}px)`   // 奇數 → 右
      : `translateX(${-offset}px)`; // 偶數 → 左
  }

  function updateAllOffsets() {
    document.querySelectorAll(".manga-item img")
      .forEach(img => applyOffset(img));
  }

  // 拉條事件
  range.addEventListener("input", () => {
    offsetRatio = parseFloat(range.value);
    valueText.textContent = `(${offsetRatio.toFixed(3)} × 寬度)`;
    updateAllOffsets();
  });

  // 切換開關
  toggleBtn.addEventListener("click", () => {
    offsetEnabled = !offsetEnabled;
    toggleBtn.textContent = offsetEnabled ? "關閉偏移" : "開啟偏移";
    updateAllOffsets();
  });

  // 初始顯示數值（用 range 的值，確保與 step 對齊後一致）
  offsetRatio = parseFloat(range.value);
  valueText.textContent = `(${offsetRatio.toFixed(3)} × 寬度)`;
})();
</script>

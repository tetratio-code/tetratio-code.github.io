<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>台灣黑白棋協會</title>
  <style>
    body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Arial, sans-serif; }
    header { position: sticky; top: 0; background: #fff; border-bottom: 1px solid #eee; z-index: 1000; }
    .wrap { max-width: 1100px; margin: 0 auto; padding: 14px 18px; display: flex; justify-content: space-between; gap: 18px; align-items: center; }
    .brand { font-size: 20px; font-weight: 700; text-decoration: none; color: #111; }
    nav { display: flex; flex-wrap: wrap; gap: 8px; justify-content: flex-end; }
    nav a { padding: 8px 12px; border: 1px solid #eee; border-radius: 999px; text-decoration: none; color: #111; }
    nav a.active { background: #111; color: #fff; border-color: #111; }
    main { max-width: 1100px; margin: 0 auto; padding: 22px 18px 60px; }
    .card { border: 1px solid #eee; border-radius: 14px; padding: 18px; background: #fafafa; }
    .hint { color: #666; }
    .loading { color:#666; }
    .error { color:#b00020; }
    code { background: #fff; border: 1px solid #e6e6e6; padding: 2px 6px; border-radius: 6px; }
    body.learn-mode header { display: none; }
    body.learn-mode main { max-width: none; padding: 0; }
    body.learn-mode .card { border: 0; border-radius: 0; padding: 0; background: transparent; }
    body.learn-mode #page-title,
    body.learn-mode #page-subtitle { display: none; }
    body.learn-mode #app { margin-top: 0 !important; }
    .menu-top { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; justify-content: space-between; margin: 0 0 12px 0; }
    .menu-tabs { display: flex; gap: 8px; flex-wrap: wrap; }
    .menu-tab { display: inline-block; padding: 8px 12px; border: 1px solid #e8e8e8; border-radius: 999px; text-decoration: none; color: #111; background: #fff; }
    .menu-tab.active { background: #111; color: #fff; border-color: #111; }
  </style>
</head>
<body>
  <header>
    <div class="wrap">
      <a class="brand" href="/" data-link>台灣黑白棋協會v1.6A</a>
      <nav>
        <a href="/about" data-link>關於協會</a>
        <a href="/tournaments" data-link>比賽資訊</a>
        <a href="/learning" data-link>學習資源</a>
        <a href="/rank/list" data-link>段位查詢</a>
        <a href="/fun/manga" data-link>休閒娛樂</a>
      </nav>
    </div>
  </header>

  <main>
    <div class="card">
      <h2 id="page-title">首頁</h2>
      <p id="page-subtitle" class="hint"></p>
      <div id="app" style="margin-top:12px;"></div>
    </div>
  </main>

  <script>
    (function restorePathFrom404() {
      var url = new URL(window.location.href);
      var p = url.searchParams.get("p");
      var q = url.searchParams.get("q");
      var h = url.searchParams.get("h");
      if (!p) return;

      var newUrl = p + (q ? ("?" + q) : "") + (h ? ("#" + h) : "");
      window.history.replaceState(null, "", newUrl);
    })();

    // ====== (B) 路由設定：每頁對應一個 /pages/*.html 片段 ======
    const routes = {
      "/": {
        title: "首頁",
        subtitle: "歡迎來到台灣黑白棋協會（示範官網）。",
        file: "/pages/home.html"
      },
      "/about": {
        title: "關於協會",
        file: "/pages/about.html"
      },
      "/tournaments": {
        title: "比賽資訊",
        file: "/pages/tournaments.html"
      },
      "/learning": {
        title: "學習資源",
        file: "/pages/learning.html"
      },
      "/rank/list": {
        title: "段位查詢｜選手名單",
        file: "/pages/rank/list.html"
      },
      "/rank/rules": {
        title: "段位查詢｜段級位規則",
        file: "/pages/rank/rules.html"
      },
      "/fun/manga": {
        title: "《游泳的金魚》",
        file: "/pages/fun/manga.html"
      },
      "/fun/links": {
        title: "友情連結",
        file: "/pages/fun/links.html"
      },
      "/fun/life": {
        title: "生活中的黑白棋",
        file: "/pages/fun/life.html"
      }
    };

    function matchRoute(pathname) {
      if (routes[pathname]) return pathname;
      if (pathname.length > 1 && pathname.endsWith("/")) {
        const p2 = pathname.slice(0, -1);
        if (routes[p2]) return p2;
      }
      return "/";
    }

    function setActiveNav(pathname) {
      document.querySelectorAll("nav a[data-link]").forEach(a => {
        const url = new URL(a.getAttribute("href"), window.location.origin);
        a.classList.toggle("active", url.pathname === pathname);
      });
    }
    function setLearnMode(isOn) {
      document.body.classList.toggle("learn-mode", isOn);
    }

    const pageCache = new Map();
    async function loadFragment(file) {
      if (pageCache.has(file)) return pageCache.get(file);

      const res = await fetch(file, { cache: "no-store" });
      if (!res.ok) throw new Error(`載入失敗：${res.status} ${res.statusText}（${file}）`);

      const html = await res.text();
      pageCache.set(file, html);
      return html;
    }

    async function render(pathname) {
      const key = matchRoute(pathname);
      const r = routes[key];
      setLearnMode(key === "/learning");
      document.getElementById("page-title").textContent = r.title;
      document.getElementById("page-subtitle").textContent = r.subtitle;
      setActiveNav(key);
      document.title = `台灣黑白棋協會｜${r.title}`;

      const app = document.getElementById("app");
      app.innerHTML = `<p class="loading">載入中…</p>`;

      try {
        const html = await loadFragment(r.file);
        await injectHtmlAndRunScripts(app, html);
      } catch (err) {
        app.innerHTML = `
          <p class="error">內容載入失敗。</p>
          <p class="hint">${String(err.message || err)}</p>
          <p class="hint">請確認檔案存在：<code>${r.file}</code></p>
        `;
      }
    }

    async function injectHtmlAndRunScripts(container, htmlText) {
      const tpl = document.createElement("template");
      tpl.innerHTML = htmlText;

      const scripts = Array.from(tpl.content.querySelectorAll("script"));
      scripts.forEach(s => s.remove());
      container.innerHTML = "";
      container.appendChild(tpl.content);

      for (const old of scripts) {
        const s = document.createElement("script");
        for (const attr of Array.from(old.attributes)) {
          s.setAttribute(attr.name, attr.value);
        }
        if (!old.src) s.textContent = old.textContent;

        document.body.appendChild(s);

        if (old.src) {
          await new Promise((res, rej) => {
            s.onload = res;
            s.onerror = () => rej(new Error(`Script 載入失敗：${old.src}`));
          });
        }
      }
    }

    document.addEventListener("click", (e) => {
      const a = e.target.closest("a[data-link]");
      if (!a) return;
      if (e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
      e.preventDefault();
      const href = a.getAttribute("href");
      window.history.pushState(null, "", href);
      render(window.location.pathname);
    });
    window.addEventListener("popstate", () => render(window.location.pathname));
    render(window.location.pathname);
  </script>
</body>
</html>

<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>表單視覺化</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
  <h2>表單資料統計</h2>
  <canvas id="chart"></canvas>

  <script>
    const API = "https://script.googleusercontent.com/macros/echo?user_content_key=AehSKLgcYkDSNPKfesnBFYwAd0BLJvYhwOiloUpHJYNSRITAHYX6nplZzuZvYG_Wm7I5j_nfWIEy6xFcxWz2a9kBQXxkITmHPWH6f3vRT12-Oy7rzjCgIpE-F-Q6pIAOn5WEoEPpPmA93--NZz80FAWAj0r7DmdFWHIFzXrAeFOCeg3t_x964hXYAfUZEE-jNHMdgyuyNFPLJv0Q_q6viZNsMOcrV3ufpfokSuy-OyTTXwDM9sucaiTGI0WY0jI2R0SNGGgjixxgIE6KNUnxMrh3OmV_OHBn19kkrANcdi5j&lib=MW9gMCtm5d85rgJvqJ-KZyvrfAuVRiGKo";

    fetch(API)
      .then(r => r.json())
      .then(({ data }) => {

        const labels = data.map(x => x["英文姓名"]);
        const values = data.map(x => Number(x["最高積分"]));

        new Chart(document.getElementById("chart"), {
          type: "bar",
          data: {
            labels,
            datasets: [{
              label: "最高積分",
              data: values
            }]
          }
        });
      });
  </script>
</body>
</html>

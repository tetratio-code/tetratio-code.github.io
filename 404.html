<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Redirecting...</title>
  <meta name="robots" content="noindex" />
</head>
<body>
  <script>
    (function () {
      var l = window.location;
      
      // ===== 安全檢查：防止干涉其他 Repo =====
      // 如果路徑層級大於 1 (例如 /other-repo/abc)，代表可能是在訪問其他專案
      // 這種情況下我們不進行 User Page 的強制跳轉
      var pathSegments = l.pathname.split('/').filter(Boolean);
      if (pathSegments.length > 0) {
        // 這裡可以列出你「不想要」被導航的路徑，或者乾脆只要有路徑就停止
        // 下面這行代表：只要不是在 User Page 根目錄觸發的 404，就不管它
        console.warn("偵測到子路徑訪問，為避免影響其他 Repo，停止自動重導向。");
        return; 
      }

      // ===== 原有重定向邏輯 =====
      var segmentCount = 0; 

      if (l.search.indexOf("p=") !== -1) {
        l.replace(l.origin + l.pathname.replace(/\/404\.html$/, "/"));
        return;
      }

      var path = l.pathname;
      var base = path.split("/").slice(0, 1 + segmentCount).join("/");
      var rest = "/" + path.split("/").slice(1 + segmentCount).join("/");
      rest = rest.replace(/\/404\.html$/, "/");
      if (rest === "//" || rest === "") rest = "/";

      var newUrl =
        l.origin +
        base +
        "/?p=" + encodeURIComponent(rest) +
        "&q=" + encodeURIComponent(l.search.slice(1)) +
        "&h=" + encodeURIComponent(l.hash.slice(1));

      l.replace(newUrl);
    })();
  </script>
</body>
</html>

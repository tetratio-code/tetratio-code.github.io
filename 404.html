<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Redirecting...</title>
  <meta name="robots" content="noindex" />
</head>
<body>
  <script>
    (function () {
      var l = window.location;
    
      // 防止無限包 p=
      if (l.search.indexOf("p=") !== -1) {
        l.replace(l.origin + l.pathname.replace(/\/404\.html$/, "/"));
        return;
      }
    
      var parts = l.pathname.split("/").filter(Boolean);
    
      // base: User Pages => ""；Project Pages => "/repo"
      var base = "";
      if (l.hostname.endsWith("github.io") && parts.length > 0) {
        // 若不是 username.github.io 這個 repo，本質上就是 project pages
        // 但這裡用通用規則：取第一段當 base
        base = "/" + parts[0];
      }
    
      var rest = l.pathname;
      if (base && rest.startsWith(base)) rest = rest.slice(base.length);
      rest = rest.replace(/\/404\.html$/, "/");
      if (!rest || rest === "/") rest = "/";
    
      var newUrl =
        l.origin +
        base +
        "/?p=" + encodeURIComponent(rest) +
        "&q=" + encodeURIComponent(l.search.slice(1)) +
        "&h=" + encodeURIComponent(l.hash.slice(1));
    
      l.replace(newUrl);
    })();
  </script>
</body>
</html>
